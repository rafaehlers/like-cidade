<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favicon transparente — Like Cidade</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f4f1;font-family:system-ui,sans-serif;color:#242d29;padding:28px}main{width:min(640px,100%);padding:28px}h1{font-size:24px;margin:0 0 8px}p{font-size:14px;color:#727976;margin:0 0 24px}.previews{display:grid;grid-template-columns:1fr 1fr;gap:16px}.sample{padding:24px;display:flex;flex-direction:column;align-items:center;gap:22px;border-radius:16px;background:#fff}.sample.dark{background:#202124;color:#f1f3f4}h2{font-size:13px;font-weight:500;margin:0}.sizes{display:flex;align-items:center;justify-content:center;gap:24px;min-height:32px}img{display:block;object-fit:contain;background:transparent}.caption{font-size:12px;color:#727976;text-align:center;margin:18px 0 0}
</style>
</head>
<body><main aria-label="Prévia do favicon"><h1>Like Cidade</h1><p>Fundo transparente, sem moldura branca.</p><div class="previews"><section class="sample"><h2>Fundo claro</h2><img src="/favicon.png?v=2" width="96" height="96" alt="Símbolo do mapa"><div class="sizes"><img src="/favicon.png?v=2" width="32" height="32" alt="Ícone de 32 pixels"><img src="/favicon.png?v=2" width="16" height="16" alt="Ícone de 16 pixels"></div></section><section class="sample dark"><h2>Fundo escuro</h2><img src="/favicon.png?v=2" width="96" height="96" alt="Símbolo do mapa"><div class="sizes"><img src="/favicon.png?v=2" width="32" height="32" alt="Ícone de 32 pixels"><img src="/favicon.png?v=2" width="16" height="16" alt="Ícone de 16 pixels"></div></section></div><p class="caption">O mesmo PNG em três tamanhos: 96, 32 e 16 pixels.</p></main></body></html>
